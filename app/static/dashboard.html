<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }

        h1 {
            margin: 0;
        }

        /* Notification Bell */
        .notification-wrapper {
            position: relative;
        }

        .notification-bell {
            position: relative;
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            font-size: 23px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-bell:hover {
            background: #f0f2f5;
        }

        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 10px;
            background: #e53935;
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* Notification Dropdown */
        .notification-dropdown {
            display: none;
            position: absolute;
            top: 55px;
            right: 0;
            width: 380px;
            max-width: calc(100vw - 40px);
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            overflow: hidden;
        }

        .notification-dropdown.show {
            display: block;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #eee;
        }

        .notification-header h3 {
            margin: 0;
            font-size: 17px;
        }

        .mark-all-btn {
            border: none;
            background: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 13px;
        }

        .mark-all-btn:hover {
            text-decoration: underline;
        }

        .notification-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .notification-item {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .notification-item:hover {
            background: #f7f8fa;
        }

        .notification-item.unread {
            background: #eef4ff;
        }

        .notification-message {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .notification-item.unread .notification-message {
            font-weight: bold;
        }

        .notification-time {
            font-size: 12px;
            color: #777;
        }

        .notification-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }

        .notification-action-btn {
            border: none;
            background: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 12px;
            padding: 0;
        }

        .notification-action-btn:hover {
            text-decoration: underline;
        }

        .empty-notifications {
            padding: 30px 15px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        /* Dashboard Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        canvas {
            max-height: 400px;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .notification-dropdown {
                position: fixed;
                top: 75px;
                right: 20px;
                left: 20px;
                width: auto;
                max-width: none;
            }

            .header {
                margin-bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <h1>My Dashboard</h1>

            <!-- Notification Center -->
            <div class="notification-wrapper">

                <button class="notification-bell" id="notificationBell" title="Notifications">
                    🔔
                    <span class="notification-badge" id="notificationBadge">
                        0
                    </span>
                </button>

                <div class="notification-dropdown" id="notificationDropdown">

                    <div class="notification-header">
                        <h3>Notifications</h3>

                        <button class="mark-all-btn" id="markAllReadBtn">
                            Mark all as read
                        </button>
                    </div>

                    <div class="notification-list" id="notificationList">
                        <div class="empty-notifications">
                            No notifications
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <!-- Dashboard Statistics -->
        <div class="cards">

            <div class="card">
                <h3>Total Posts</h3>
                <div class="value" id="totalPosts">0</div>
            </div>

            <div class="card">
                <h3>Total Comments Made</h3>
                <div class="value" id="totalComments">0</div>
            </div>

            <div class="card">
                <h3>Total Likes Received</h3>
                <div class="value" id="totalLikes">0</div>
            </div>

            <div class="card">
                <h3>Total Post Views</h3>
                <div class="value" id="totalViews">0</div>
            </div>

        </div>

        <!-- Likes and Comments Chart -->
        <div class="chart-container">

            <h2>Likes and Comments per Post</h2>

            <canvas id="postChart"></canvas>

        </div>

        <!-- Post Activity Chart -->
        <div class="chart-container">

            <h2>Post Activity Over Time</h2>

            <canvas id="activityChart"></canvas>

        </div>

    </div>


    <script>

        const token = prompt("Enter your JWT access token:");

        let postChart;
        let activityChart;


        /* =========================
           DASHBOARD
        ========================= */

        async function loadDashboard() {

            const response = await fetch("/user/dashboard", {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            });

            if (!response.ok) {

                alert(
                    "Unable to load dashboard. Please check your login token."
                );

                return;
            }

            const data = await response.json();


            /* Dashboard statistics */

            document.getElementById("totalPosts").textContent =
                data.total_posts;

            document.getElementById("totalComments").textContent =
                data.total_comments;

            document.getElementById("totalLikes").textContent =
                data.total_likes_received;

            document.getElementById("totalViews").textContent =
                data.total_post_views;


            /* Likes and Comments per Post */

            const postLabels =
                data.posts.map(post => post.title);

            const likes =
                data.posts.map(post => post.likes);

            const comments =
                data.posts.map(post => post.comments);


            if (postChart) {
                postChart.destroy();
            }


            postChart = new Chart(
                document.getElementById("postChart"),
                {
                    type: "bar",

                    data: {
                        labels: postLabels,

                        datasets: [
                            {
                                label: "Likes",
                                data: likes
                            },
                            {
                                label: "Comments",
                                data: comments
                            }
                        ]
                    },

                    options: {
                        responsive: true,

                        plugins: {
                            legend: {
                                position: "top"
                            }
                        },

                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                }
            );


            /* Post Activity Over Time */

            const activityLabels =
                data.activity.map(item => item.date);

            const activityPosts =
                data.activity.map(item => item.posts);


            if (activityChart) {
                activityChart.destroy();
            }


            activityChart = new Chart(
                document.getElementById("activityChart"),
                {
                    type: "line",

                    data: {
                        labels: activityLabels,

                        datasets: [
                            {
                                label: "Posts Created",
                                data: activityPosts,
                                fill: false,
                                tension: 0.3
                            }
                        ]
                    },

                    options: {
                        responsive: true,

                        plugins: {
                            legend: {
                                position: "top"
                            }
                        },

                        scales: {
                            y: {
                                beginAtZero: true,

                                ticks: {
                                    stepSize: 1
                                }
                            }
                        }
                    }
                }
            );
        }


        /* =========================
           NOTIFICATIONS
        ========================= */

        async function loadNotifications() {

            try {

                const response = await fetch(
                    "/notifications",
                    {
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );


                if (!response.ok) {
                    return;
                }


                const notifications =
                    await response.json();


                renderNotifications(notifications);

            } catch (error) {

                console.error(
                    "Failed to load notifications:",
                    error
                );

            }
        }


        function renderNotifications(notifications) {

            const list =
                document.getElementById("notificationList");

            const badge =
                document.getElementById("notificationBadge");


            list.innerHTML = "";


            /* Count unread notifications */

            const unreadCount =
                notifications.filter(
                    notification => !notification.is_read
                ).length;


            /* Update badge */

            if (unreadCount > 0) {

                badge.textContent =
                    unreadCount > 99 ? "99+" : unreadCount;

                badge.style.display = "flex";

            } else {

                badge.style.display = "none";

            }


            /* No notifications */

            if (notifications.length === 0) {

                list.innerHTML = `
                    <div class="empty-notifications">
                        No notifications
                    </div>
                `;

                return;
            }


            /* Render notifications */

            notifications.forEach(notification => {

                const item =
                    document.createElement("div");

                item.className =
                    "notification-item" +
                    (notification.is_read ? "" : " unread");


                const date =
                    new Date(notification.created_at);


                const formattedTime =
                    date.toLocaleString();


                item.innerHTML = `

                    <div class="notification-message">
                        ${escapeHtml(notification.message)}
                    </div>

                    <div class="notification-time">
                        ${formattedTime}
                    </div>

                    <div class="notification-actions">

                        ${notification.is_read
                        ?
                        `<button
                                class="notification-action-btn"
                                onclick="markAsUnread(${notification.id})"
                            >
                                Mark as unread
                            </button>`
                        :
                        `<button
                                class="notification-action-btn"
                                onclick="markAsRead(${notification.id})"
                            >
                                Mark as read
                            </button>`
                    }

                    </div>

                `;


                list.appendChild(item);

            });
        }


        /* =========================
           MARK AS READ
        ========================= */

        async function markAsRead(notificationId) {

            const response =
                await fetch(
                    `/notifications/${notificationId}/read`,
                    {
                        method: "PATCH",

                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );


            if (response.ok) {

                await loadNotifications();

            }
        }


        /* =========================
           MARK AS UNREAD
        ========================= */

        async function markAsUnread(notificationId) {

            const response =
                await fetch(
                    `/notifications/${notificationId}/unread`,
                    {
                        method: "PATCH",

                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );


            if (response.ok) {

                await loadNotifications();

            }
        }


        /* =========================
           MARK ALL AS READ
        ========================= */

        async function markAllAsRead() {

            const response =
                await fetch(
                    "/notifications/read-all",
                    {
                        method: "PATCH",

                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );


            if (response.ok) {

                await loadNotifications();

            }
        }


        /* =========================
           HTML SAFETY
        ========================= */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }


        /* =========================
           BELL DROPDOWN
        ========================= */

        const bell =
            document.getElementById("notificationBell");

        const dropdown =
            document.getElementById("notificationDropdown");


        bell.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                dropdown.classList.toggle("show");

            }
        );


        document.addEventListener(
            "click",
            function (event) {

                if (
                    !dropdown.contains(event.target) &&
                    !bell.contains(event.target)
                ) {

                    dropdown.classList.remove("show");

                }

            }
        );


        document.getElementById(
            "markAllReadBtn"
        ).addEventListener(
            "click",
            markAllAsRead
        );


        /* =========================
           INITIAL LOAD
        ========================= */

        loadDashboard();

        loadNotifications();


        /* =========================
           REAL-TIME-LIKE POLLING
        ========================= */

        setInterval(
            loadNotifications,
            5000
        );

    </script>

</body>

</html>
